<script>
    let base = Number( prompt( "Captura la base del rectángulo: " ) );
    let height = Number( prompt( "Captura la altura del rectángulo: " ) );

    let area = base * height;

    alert( "El área es: " + area );
    console.log( "El área es: " + area );
</script>
