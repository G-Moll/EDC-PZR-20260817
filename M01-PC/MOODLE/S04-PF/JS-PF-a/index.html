<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Paper Scissor Rock</title>
</head>

<body>
    <div class="wrapper">
        <div class="results">
            <div>Jugador 1</div>
            <div>
                <span>Jugar</span>
                <span class="paper"   id="paper">🖐🏼</span>
                <span class="scissor" id="scissor">✌🏼</span>
                <span class="rock"    id="rock">👊🏼</span>
            </div>
            <div>Jugador 2</div>
        </div>

        <div>
            <div class="matches" id="matches">
                <p>Jugador 1 ganó</p>
                <p>Jugador 2 ganó</p>
                <p>Empate</p>
                <p>Jugador 2 ganó</p>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
